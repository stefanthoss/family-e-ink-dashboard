services:
  family-e-ink-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-e-ink-dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
