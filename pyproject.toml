[tool.poetry]
name = "family-e-ink-dashboard"
version = "0.10.1"
description = "E-Ink dashboard showing weather and a family calendar running on an Inkplate 10, rendering done in a Docker container"
authors = ["speedyg0nz", "stefanthoss"]
license = "Apache License 2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.162.0"
jinja2 = "^3.1.6"
pillow = "^13.0.0"
pytz = "^2026.6"
recurring-ical-events = "^3.8.2"
requests = "^2.34.2"
selenium = "^4.52.0"
structlog = "^26.1.0"
uvicorn = "^0.54.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.3"
pytest = "^9.2.0"
pytest-mock = "^3.17.0"
pytest-cov = "^7.1.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E712"]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
